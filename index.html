
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PilotAI</title>
<style>
:root{color-scheme:dark;--bg:#070b09;--panel:#0b110e;--surface:#131b17;--line:#1f2b25;--text:#e6efe9;--muted:#84968b;--green:#3ddc84;--deep:#14452b;--serif:"Iowan Old Style",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{display:flex;height:100%}
aside{width:272px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font:600 22px var(--serif);padding:4px 8px 14px}
.brand svg{width:30px;height:30px}
.btn{background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;color:var(--text);width:100%}
.btn:hover{background:var(--surface)}
.new{background:var(--deep);color:var(--green);font-weight:600}
.new:hover{background:#1a5636}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:8px}
#list .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#list .on{background:var(--surface);color:var(--text)}
.stat{color:var(--muted);font-size:13px;padding:8px 10px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#menu{display:none;position:absolute;top:10px;left:10px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
#log{flex:1;overflow:auto;padding:28px 20px 12px}
.col{max-width:740px;margin:0 auto}
.hero{text-align:center;margin-top:16vh}
.hero svg{width:52px;height:52px}
.hero h1{font:500 36px/1.2 var(--serif);margin:14px 0 6px}
.hero p{color:var(--muted);margin:0}
.msg{margin:0 0 22px}
.me{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;width:fit-content;max-width:85%;margin-left:auto;white-space:pre-wrap}
.bot{display:flex;gap:12px;font:17px/1.75 var(--serif)}
.bot svg{width:26px;height:26px;flex:none;margin-top:5px}
.bot div{max-width:66ch}
#bar{padding:6px 20px 18px}
#box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:10px;transition:border-color .15s}
#box:focus-within{border-color:var(--green)}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:160px;min-height:28px;padding:4px 0}
#go{width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:#04110a;display:grid;place-items:center;flex:none}
#go:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:var(--muted);font-size:12.5px;margin:8px 0 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{font:500 24px var(--serif);margin:0 0 6px}
dialog p{color:var(--muted);margin:0 0 12px}
dialog textarea{width:100%;height:180px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.row .btn{width:auto;border:1px solid var(--line)}
.row .new{border-color:transparent}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:4;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}aside.open{transform:none}#menu{display:block}.hero{margin-top:12vh}.hero h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<aside id="side">
<div class="brand">
<svg viewBox="0 0 100 100" fill="#3ddc84">
<path d="M50 5 L59 39 L91 57 L91 65 L59 56 L59 83 L72 92 L72 97 L50 91 L28 97 L28 92 L41 83 L41 56 L9 65 L9 57 L41 39 Z"/>
</svg>
PilotAI
</div>
<button class="btn new" id="new">New chat</button>
<div id="list"></div>
<div class="stat" id="stat"></div>
<button class="btn" id="teach">Train PilotAI</button>
</aside>
<main>
<button id="menu" aria-label="Open sidebar">Menu</button>
<div id="log"><div class="col" id="col"></div></div>
<div id="bar"><div class="col">
<div id="box">
<textarea id="in" rows="1" placeholder="Ask PilotAI anything"></textarea>
<button id="go" aria-label="Send" disabled>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
</div>
<p class="note">PilotAI runs entirely in your browser. No API keys, no servers.</p>
</div></div>
</main>
</div>
<dialog id="dlg">
<h2>Train PilotAI</h2>
<p>Paste your own writing, notes or facts. PilotAI learns the words and phrasing and uses them in its answers.</p>
<textarea id="txt" placeholder="Paste text here…"></textarea>
<div class="row">
<button class="btn" id="reset">Forget my training</button>
<button class="btn" id="close">Close</button>
<button class="btn new" id="learn">Train model</button>
</div>
</dialog>
<script>
const $=s=>document.querySelector(s);

const STAR='<svg viewBox="0 0 100 100" fill="#3ddc84"><path d="M50 5 L59 39 L91 57 L91 65 L59 56 L59 83 L72 92 L72 97 L50 91 L28 97 L28 92 L41 83 L41 56 L9 65 L9 57 L41 39 Z"/></svg>';

const BASE=`Hello, pilot. I am PilotAI, a small language model that lives entirely in your browser. I was built from scratch, so I do not call any outside service or use anyone else’s API key. Everything I know comes from the text I was trained on, and you can train me on your own writing at any time. When you ask a question, I look for the sentences closest to your words and then continue them one word at a time. Each next word is chosen from the patterns I have seen, which is the same basic idea behind larger language models. My memory is small, so I work best on short, focused questions. I can help you plan a project, outline an idea, or practice putting thoughts into clear sentences. A good plan starts with one goal, a short list of steps, and a date for the first step. To write better, say one idea per sentence and cut every word that does not carry meaning. When you feel stuck, break the problem into smaller parts and finish the smallest part first. Good code is easy to read, easy to test, and easy to change later. If you want me to know more, open the training panel and paste in your notes, articles or stories. Your training stays on this device and is never sent anywhere. Privacy matters, so I keep your chats in your own browser storage. I can be wrong, and I do not understand the world the way a person does. Treat my answers as a starting point and check anything important. Ask me to brainstorm names, outline a talk, or suggest a first step. Learning something new works best in small daily sessions with one clear target. A strong idea is one you can explain in two sentences to a friend. Thanks for flying with me, and tell me where you want to go next.`;

let extra='',chats=[],cur=null,sents=[],tri={},bi={},df={};

try{
extra=localStorage.getItem('pilot-extra')||'';
chats=JSON.parse(localStorage.getItem('pilot-chats')||'[]');
}catch(e){}

const tok=s=>s.toLowerCase().replace(/'/g,'’').match(/[a-z0-9’-]+|[.,!?]/g)||[];

function build(){
sents=(BASE+'\n'+extra).split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>3);
tri={};bi={};df={};
sents.forEach(s=>{
const t=['<s>','<s>',...tok(s),'</s>'];
new Set(t).forEach(w=>df[w]=(df[w]||0)+1);
for(let i=2;i<t.length;i++){
(tri[t[i-2]+' '+t[i-1]]??=[]).push(t[i]);
(bi[t[i-1]]??=[]).push(t[i]);
}
});
$('#stat').textContent=Object.keys(df).length+' words learned from '+sents.length+' sentences';
}

const pick=a=>a[Math.floor(Math.random()*a.length)];

function reply(q){
const qs=new Set(tok(q)),N=sents.length;
const score=s=>tok(s).reduce((n,w)=>n+(qs.has(w)&&/\w/.test(w)?Math.log(N/(df[w]||1)):0),0)+Math.random()*.4;
const ranked=sents.map(s=>[score(s),s]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
const out=[];
for(let k=0;k<3&&out.length<48;k++){
const t=tok(ranked[k]);let a='<s>',b=t[0];const w=[b];
for(let i=0;i<26;i++){
let c=tri[a+' '+b]||bi[b];if(!c)break;
let n=pick(c);
for(let j=0;j<3&&!qs.has(n);j++){const m=pick(c);if(qs.has(m)){n=m;break}}
if(n==='</s>')break;
w.push(n);a=b;b=n;
}
out.push(...w,'.');
if(k===0&&out.length>16)break;
}
let s=out.join(' ').replace(/ ([.,!?])/g,'$1').replace(/([.!?])\1+/g,'$1').replace(/([.!?,])\s*\./g,'$1').replace(/\bi\b/g,'I').replace(/\bpilotai\b/gi,'PilotAI');
return s.replace(/(^|[.!?]\s+)([a-z])/g,(m,p,c)=>p+c.toUpperCase());
}

const save=()=>{
try{localStorage.setItem('pilot-chats',JSON.stringify(chats.slice(0,40)))}catch(e){}
};

function esc(t){
const d=document.createElement('div');
d.textContent=t;
return d.innerHTML;
}

function view(){
const c=chats.find(x=>x.id===cur),col=$('#col');
$('#list').innerHTML=chats.map(x=>`<button class="btn ${x.id===cur?'on':''}" data-id="${x.id}">${esc(x.title)}</button>`).join('');
if(!c||!c.msgs.length){
const h=new Date().getHours();
col.innerHTML=`<div class="hero">${STAR}<h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}, pilot</h1><p>What are we working on today?</p></div>`;
return;
}
col.innerHTML=c.msgs.map(m=>m.r==='u'?`<div class="msg"><div class="me">${esc(m.t)}</div></div>`:`<div class="msg bot">${STAR}<div>${esc(m.t)}</div></div>`).join('');
$('#log').scrollTop=1e9;
}

function newChat(){
cur=null;
$('#side').classList.remove('open');
view();
$('#in').focus();
}

async function send(){
const i=$('#in'),q=i.value.trim();
if(!q)return;
let c=chats.find(x=>x.id===cur);
if(!c){
c={id:Date.now(),title:q.slice(0,40),msgs:[]};
chats.unshift(c);
cur=c.id;
}
c.msgs.push({r:'u',t:q});
i.value='';
i.style.height='';
$('#go').disabled=true;
view();
const a=reply(q),m={r:'a',t:''};
c.msgs.push(m);
view();
const words=a.split(' ');
for(const w of words){
m.t+=(m.t?' ':'')+w;
const el=$('#col').lastElementChild.lastElementChild;
if(el)el.textContent=m.t;
$('#log').scrollTop=1e9;
await new Promise(r=>setTimeout(r,28));
}
save();
view();
}

$('#in').addEventListener('input',e=>{
const t=e.target;
t.style.height='auto';
t.style.height=Math.min(t.scrollHeight,160)+'px';
$('#go').disabled=!t.value.trim();
});

$('#in').addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
send();
}
});

$('#go').onclick=send;
$('#new').onclick=newChat;

$('#list').onclick=e=>{
const b=e.target.closest('[data-id]');
if(b){
cur=+b.dataset.id;
$('#side').classList.remove('open');
view();
}
};

$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#teach').onclick=()=>$('#dlg').showModal();
$('#close').onclick=()=>$('#dlg').close();

$('#learn').onclick=()=>{
const t=$('#txt').value.trim();
if(!t)return;
extra+=(extra?'\n':'')+t;
try{localStorage.setItem('pilot-extra',extra)}catch(e){}
build();
$('#txt').value='';
$('#dlg').close();
};

$('#reset').onclick=()=>{
extra='';
try{localStorage.removeItem('pilot-extra')}catch(e){}
build();
$('#dlg').close();
};

build();
view();
</script>
</body>
</html>
